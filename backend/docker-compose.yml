# Development stack: code bind-mounted, vendor/ in a named volume.
#   docker compose up -d --build
# Every name and port comes from .env (APP_SLUG, *_PORT) so several projects
# made from this starter run side by side.

name: ${APP_SLUG:-pos}-api

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: ${APP_SLUG:-pos}_api_app
    # restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:z
      - vendor:/var/www/html/vendor
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - api_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ${APP_SLUG:-pos}_api_nginx
    # restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8210}:80"
    volumes:
      - .:/var/www/html:z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - api_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: ${APP_SLUG:-pos}_api_db
    # restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-3321}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - api_network
    healthcheck:
      # over TCP as the app user: MySQL's first-run init server answers on the
      # socket only, so this passes once the real server (and the user) is up
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 --protocol=tcp -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${APP_SLUG:-pos}_api_phpmyadmin
    ports:
      - "${PMA_PORT:-8211}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - api_network
    depends_on:
      - db

  # catches every email in development (reset-password links …): open http://localhost:${MAILPIT_PORT}
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${APP_SLUG:-pos}_api_mailpit
    ports:
      - "${MAILPIT_PORT:-8212}:8025"
    networks:
      - api_network

networks:
  api_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  vendor:
    driver: local
