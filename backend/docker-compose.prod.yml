# Production stack. Standalone: use it on its own, never together with docker-compose.yml.
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app php artisan migrate --force
#
# Differs from development: code and vendor/ live in the image (--no-dev), no phpMyAdmin,
# MySQL is not published, nginx listens on localhost only (a reverse proxy on the host does HTTPS).
# NEVER run `down -v` here: it deletes the database.

name: ${APP_SLUG:-pos}-api-prod

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  app:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
        COMPOSER_FLAGS: --no-dev
    container_name: ${APP_SLUG:-pos}_api_prod_app
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    networks:
      - api_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    <<: *service
    image: nginx:1.28-alpine
    container_name: ${APP_SLUG:-pos}_api_prod_nginx
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8210}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - api_network
    depends_on:
      - app

  db:
    <<: *service
    image: mysql:8.4
    container_name: ${APP_SLUG:-pos}_api_prod_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - api_network
    healthcheck:
      # over TCP as the app user: MySQL's first-run init server answers on the
      # socket only, so this passes once the real server (and the user) is up
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 --protocol=tcp -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  api_network:
    driver: bridge

volumes:
  db_data:
    driver: local
